server.port: 8080
spring:
  servlet.multipart.max-file-size: 20MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ragbot
    username: ${DB_USER:ragbot}
    password: ${DB_PASSWORD:ragbot}
  jpa.hibernate.ddl-auto: update
  ai:
    vertex.ai:
      gemini:
        project-id: ${GCP_PROJECT}
        location: ${GCP_LOCATION:europe-west4}
        chat.options: { model: gemini-2.5-flash, temperature: 0.2 }
      embedding:
        project-id: ${GCP_PROJECT}
        location: ${GCP_LOCATION:europe-west4}
        text.options.model: text-embedding-005
    vectorstore.pgvector:
      initialize-schema: true
      dimensions: 768
      index-type: HNSW
      distance-type: COSINE_DISTANCE
app:
  admin-token: ${ADMIN_TOKEN:change-me}          # токен для панели управления
  telegram:
    token: ${TELEGRAM_TOKEN:}                    # от @BotFather
    secret: ${TELEGRAM_WEBHOOK_SECRET:change-me} # проверяется в заголовке вебхука
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}               # xoxb-... (scopes: chat:write, app_mentions:read, im:history)
    signing-secret: ${SLACK_SIGNING_SECRET:}     # Basic Information → Signing Secret
  rag: { top-k: 5, threshold: 0.55 }
management.endpoints.web.exposure.include: health,info
