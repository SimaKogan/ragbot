services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: ragbot, POSTGRES_USER: ragbot, POSTGRES_PASSWORD: ragbot }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DB_HOST: db
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
    volumes: ["${GCP_KEY_FILE:-./gcp.json}:/secrets/gcp.json:ro"]
volumes: { pgdata: {} }
